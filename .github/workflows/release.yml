name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev plocate

      - name: Install appimagetool
        run: |
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Build and package AppImage
        run: fastforge package --platform linux --targets appimage

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT=$(find dist/ -name "*.AppImage" | head -1)
          cp "$ARTIFACT" "dist/lapse-${VERSION}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/lapse-*-linux-x86_64.AppImage
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Build and package DMG
        run: fastforge package --platform macos --targets dmg

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT=$(find dist/ -name "*.dmg" | head -1)
          cp "$ARTIFACT" "dist/lapse-${VERSION}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/lapse-*-macos-arm64.dmg
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Build and package ZIP
        run: fastforge package --platform windows --targets zip

      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT=$(find dist/ -name "*.zip" | head -1)
          cp "$ARTIFACT" "dist/lapse-${VERSION}-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/lapse-*-windows-x86_64.zip
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum lapse-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lapse v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/lapse-*
            artifacts/checksums.txt

  publish-aur:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(sha256sum artifacts/lapse-*-linux-x86_64.AppImage | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate PKGBUILD
        run: |
          sed \
            -e "s|%%VERSION%%|${{ steps.version.outputs.version }}|g" \
            -e "s|%%SHA256%%|${{ steps.sha.outputs.sha256 }}|g" \
            .github/aur/PKGBUILD.template > PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: lapse-appimage
          pkgbuild: ./PKGBUILD
          assets: .github/aur/lapse.desktop
          commit_username: Pairadux
          commit_email: pairadux@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"

  publish-homebrew:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(sha256sum artifacts/lapse-*-macos-arm64.dmg | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate cask formula
        run: |
          sed \
            -e "s|%%VERSION%%|${{ steps.version.outputs.version }}|g" \
            -e "s|%%SHA256%%|${{ steps.sha.outputs.sha256 }}|g" \
            .github/homebrew/lapse.rb.template > lapse.rb

      - name: Push cask to tap repository
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}@github.com/Pairadux/homebrew-lapse.git tap
          mkdir -p tap/Casks
          cp lapse.rb tap/Casks/lapse.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lapse.rb
          git diff --cached --quiet || git commit -m "Update lapse to ${{ steps.version.outputs.version }}"
          git push
